<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Face Detector - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
}

.container{
    width:380px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.logo{
    text-align:center;
    font-size:40px;
    margin-bottom:10px;
}

h2{
    text-align:center;
    color:#1e3c72;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:gray;
    margin-bottom:25px;
    font-size:14px;
}

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#1e3c72;
}

.options{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#1e3c72;
}

button{
    width:100%;
    padding:12px;
    background:#1e3c72;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#16335d;
}

.signup{
    text-align:center;
    margin-top:20px;
}

.signup a{
    text-decoration:none;
    color:#1e3c72;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:15px;
    color:green;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<div class="logo">🛡️</div>

<h2>Fake Face Detector</h2>

<p class="subtitle">Login to continue</p>

<form id="loginForm">

<div class="input-group">
<label>Email</label>
<input
type="email"
id="email"
placeholder="Enter your email"
required>
</div>

<div class="input-group">
<label>Password</label>
<input
type="password"
id="password"
placeholder="Enter your password"
required>
</div>

<div class="options">
<label>
<input type="checkbox">
 Remember Me
</label>

<a href="#">Forgot Password?</a>
</div>

<button type="submit">Login</button>

</form>

<div id="message"></div>

<div class="signup">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

</div>

<script type="module">

import { auth } from "./src/firebase.js";
import { signInWithEmailAndPassword } from "firebase/auth";

document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    try {
        await signInWithEmailAndPassword(auth, email, password);

        alert("Login Successful!");
        window.location.href = "dashboard.html";

    } catch (error) {
        alert("Login Failed: " + error.message);
    }
});
</script>

</body>
</html>
