<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Management</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}


/* Header */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    color:#1f2937;
}

.search{
    padding:12px;
    width:250px;
    border:1px solid #ccc;
    border-radius:8px;
}


/* Back to Dashboard */

.dashboard-btn{
    display:inline-block;
    margin-bottom:25px;
    padding:10px 18px;
    background:#1f2937;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.dashboard-btn:hover{
    background:#374151;
}


/* Summary Cards */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card h3{
    color:#555;
    margin-bottom:10px;
}

.card p{
    font-size:30px;
    color:#2563eb;
    font-weight:bold;
}


/* User Section */

.user-section{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.user-section h2{
    color:#1f2937;
}


/* Table */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#2563eb;
    color:white;
    padding:15px;
    text-align:left;
}

td{
    padding:15px;
    border-bottom:1px solid #ddd;
}


/* Status */

.status{
    padding:6px 12px;
    color:white;
    border-radius:20px;
    font-size:14px;
}

.active{
    background:#16a34a;
}


/* Responsive */

@media(max-width:700px){

    .header{
        flex-direction:column;
        gap:15px;
    }

    .search{
        width:100%;
    }

    table{
        font-size:14px;
    }

}

</style>

</head>


<body>


<!-- Header -->

<div class="header">

    <h1>👥 User Management</h1>

    <input
        class="search"
        type="text"
        placeholder="Search users..."
    >

</div>


<!-- Dashboard Button -->

<a class="dashboard-btn" href="dashboard.html">
    ← Back to Dashboard
</a>



<!-- User Statistics -->

<div class="cards">


    <div class="card">

        <h3>Current User</h3>

        <p id="userCount">1</p>

    </div>


    <div class="card">

        <h3>Account Status</h3>

        <p style="font-size:22px;">Active</p>

    </div>


    <div class="card">

        <h3>Email Verified</h3>

        <p id="verifiedStatus" style="font-size:22px;">
            Checking...
        </p>

    </div>


    <div class="card">

        <h3>Account Type</h3>

        <p style="font-size:22px;">
            User
        </p>

    </div>


</div>



<!-- User Information -->

<div class="user-section">

    <h2>My Account Information</h2>


    <table>

        <tr>

            <th>User ID</th>

            <th>Name</th>

            <th>Email</th>

            <th>Status</th>

        </tr>


        <tr>

            <td id="userId">
                Loading...
            </td>

            <td id="userName">
                Loading...
            </td>

            <td id="userEmail">
                Loading...
            </td>

            <td>

                <span class="status active">
                    Active
                </span>

            </td>

        </tr>

    </table>

</div>



<!-- Firebase -->

<script type="module">

import { auth } from "./src/firebase.js";

import {
    onAuthStateChanged
} from "firebase/auth";


onAuthStateChanged(auth, (user) => {

    if (user) {

        /*
         * User is logged in.
         * Get information from Firebase.
         */


        document.getElementById("userId").textContent =
            user.uid;


        document.getElementById("userName").textContent =
            user.displayName || "Name not available";


        document.getElementById("userEmail").textContent =
            user.email;


        /*
         * Check email verification
         */

        if (user.emailVerified) {

            document.getElementById("verifiedStatus").textContent =
                "Yes";

        } else {

            document.getElementById("verifiedStatus").textContent =
                "No";

        }


    } else {

        /*
         * No user is logged in.
         * Send them back to login.
         */

        window.location.href = "login.html";

    }

});

</script>


</body>

</html>
