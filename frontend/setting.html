<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:700px;
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.logo{
    font-size:60px;
    text-align:center;
    margin-bottom:15px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#00e5ff;
}

.info{
    margin:15px 0;
    font-size:18px;
    line-height:1.8;
}

.info strong{
    color:#00e5ff;
}

.back-btn{
    display:block;
    width:180px;
    margin:30px auto 0;
    padding:12px;
    text-align:center;
    text-decoration:none;
    background:#00bcd4;
    color:white;
    border-radius:25px;
    font-weight:bold;
    transition:0.3s;
}

.back-btn:hover{
    background:#0097a7;
}
</style>

</head>
<body>

<div class="container">

    <div class="logo">🤖</div>

    <h1>Settings</h1>

    <div class="info">
        <p><strong>Project Name:</strong> Fake Face Detector</p>
        <p><strong>Version:</strong> 1.0</p>
        <p><strong>Purpose:</strong> Detect whether a face image is real or AI-generated/fake.</p>
        <p><strong>Technology Used:</strong> HTML, CSS, JavaScript</p>
        <p><strong>Developer:</strong> VISHAL P GOWDA</p>
        <p><strong>Project Status:</strong> Active</p>
    </div>

    <a href="dashboard.html" class="back-btn">⬅ Back to Dashboard</a>

</div>

</body>
</html>
